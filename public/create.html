<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jersey+10&family=SUSE+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/db29c2ca45.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="css/style.css">
    <title>CoreNet</title>
</head>
<body>
<nav class="corenet-home-navbar-1">
        <a class="corenet-home-link-blank-1" href="../index.html" class="">
            <div class="corenet-home-div-navbar-1">
                GO TO HOME
            </div>
        </a>  
</nav>

 <main class="container">
      <div class="corenet-home-box-2">
         <div class="corenet-create-box-1">
            <div class="corenet-create-div-1">
                <h1 class="corenet-home-h1-1">Create your Blog ! </h1>
            </div>
             <div class="corenet-create-div-2">
                    <form class="corenet-create-form-1" action="http://localhost:5000/api/v1/create-post" method="post">
                        <div class="corenet-create-form-container-1">

                            <div class="corenet-create-form-div-input-1">
                                <span>Title</span>
                                <input placeholder="Type here" title="Type a title for blog." required maxlength="90" class="corenet-create-form-input-1" type="text" name="titulo" >
                            </div>
                            <div class="corenet-create-form-div-input-1">
                                <span>Content</span>
                                <textarea placeholder="Type here" title="Type a content for blog." required maxlength="4000" class="corenet-create-form-input-1" name="conteudo" id="corenet-create-textarea-input-1"></textarea>
                            </div>
                            
                        </div>
                        <input value="Create Post" class="corenet-create-input-submit-1" type="submit">
                    </form>
                          
            </div>
         </div>
      </div>
      <form method="get" class="corenet-home-blogs-conatiner-1" action="http://localhost:5000/api/v1/blog-id">
                        <input type="hidden" value="17592186045419" name="id">
                        <button type="submit"></button>
                    </form>
    <script src="../out/main.js" type="text/javascript"></script>
</body>
</html>
